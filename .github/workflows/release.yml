name: Release
# A tag vX.Y.Z (the version of package.json at that commit, on main) publishes that version of the compiler as a GitHub
# release of this repository: the job checks it (lint, tests, coverage), packs it (npm pack: the package, its Rust core
# in wasm and the kits' catalog), writes the release files with scripts/release.mjs, then creates the release:
#   compiler-<version>.tgz   the package (npm install <its release URL>)
#   SHA256SUMS               the sha256 of the files
#   release.json             what the release holds (format: README); the GripForge site reads the public releases API
# Notes: the annotated tag's message, else the CHANGELOG section, then the install line and the sums. Nothing goes to
# the npm registry, and no file is an Actions artifact. A version is never rewritten (an existing release stops the job).
# workflow_dispatch: a dry run only (builds the files, creates nothing).
#
# GitHub-hosted runner; actions pinned by SHA. Only this job has contents: write (the GITHUB_TOKEN creates the release);
# GF_SPLIT_READ_TOKEN only reads the kits SDK (gripforgeai/module-kits).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to try, e.g. 0.1.0 (dry run, nothing published)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  GF_JOBS: '4'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version, tag on main
        id: sdk
        run: |
          set -eu
          v="${VERSION#v}"
          [[ $v =~ ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$ ]] || { echo "::error::not a version vX.Y.Z: $VERSION"; exit 1; }
          [ "$(node -p "require('./package.json').version")" = "$v" ] || { echo "::error::the tag says $v, package.json says $(node -p "require('./package.json').version")"; exit 1; }
          if [ "$PUBLISH" = true ]; then
            git fetch -q --force origin "+refs/tags/v$v:refs/tags/v$v" +refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::v$v ($GITHUB_SHA) is not on main: only main is released"; exit 1; }
          fi
          [ -n "${{ secrets.GF_SPLIT_READ_TOKEN != '' && 'set' || '' }}" ] || { echo "::error::secret GF_SPLIT_READ_TOKEN missing (read access to gripforgeai/module-kits)"; exit 1; }
          echo "V=$v" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "rev=$(node -p "require('./sdk.json').rev")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gripforgeai/module-kits
          ref: ${{ steps.sdk.outputs.rev }}
          token: ${{ secrets.GF_SPLIT_READ_TOKEN }}
          path: .sdk/module-kits
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
          components: rust-src,rustfmt,clippy,llvm-tools
      - name: Checks (lint, tests, coverage)
        env:
          CI: '1'
        run: |
          set -eu
          npm run lint
          npm test
          npm run coverage
          npm run coverage:rust
      - name: Pack
        run: |
          set -eu
          rm -rf dist
          file=$(npm pack --pack-destination "$RUNNER_TEMP" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].filename))')
          echo "TGZ=$RUNNER_TEMP/$file" >> "$GITHUB_ENV"
          sha256sum "$RUNNER_TEMP/$file"
      - name: The release files
        run: node scripts/release.mjs "$V" --tgz "$TGZ" --out "$RUNNER_TEMP/release"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          r="$RUNNER_TEMP/release"
          ls -l "$r"
          if [ "$PUBLISH" != true ]; then
            echo "dry run: release v$V not created"; cat "$r/notes.md"; exit 0
          fi
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::error::the release v$V already exists: a version is never rewritten, release a new one"; exit 1
          fi
          gh release create "v$V" "$r/compiler-$V.tgz" "$r/SHA256SUMS" "$r/release.json" \
            --verify-tag --title "v$V" --notes-file "$r/notes.md"
