name: Compatibility with the latest kits
# Each push to main and each night (never on a pull request: it reads the private kits SDK): this compiler (its core built from the pinned SDK of sdk.json) builds the
# dev.builder room of the LATEST kits (gripforgeai/module-kits, the branch `track` of sdk.json, or the ref given by
# hand), then the kits' own end-to-end test (kits/dev_builder/tests/compiled.rs) loads the compiled game and checks it
# reaches the same state as the dev mode (same gripforge.debug/1 snapshot, same engine tree). Red here: the kits moved
# and the compiler must follow (update sdk.json, then the golden files).
#
# GitHub-hosted runner; contents: read; actions pinned by SHA. No demo game, no paid AI call.
# Secret: GF_SPLIT_READ_TOKEN (read access to gripforgeai/module-kits).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: The module-kits branch or commit to check against (default the `track` of sdk.json)
        required: false

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  GF_JOBS: '4'

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Revisions
        id: sdk
        env:
          REF: ${{ inputs.ref }}
        run: |
          [ -n "${{ secrets.GF_SPLIT_READ_TOKEN != '' && 'set' || '' }}" ] || { echo "::error::secret GF_SPLIT_READ_TOKEN missing (read access to gripforgeai/module-kits)"; exit 1; }
          echo "rev=$(node -p "require('./sdk.json').rev")" >> "$GITHUB_OUTPUT"
          echo "latest=${REF:-$(node -p "require('./sdk.json').track")}" >> "$GITHUB_OUTPUT"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: The pinned SDK (the core of the compiler is built from it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gripforgeai/module-kits
          ref: ${{ steps.sdk.outputs.rev }}
          token: ${{ secrets.GF_SPLIT_READ_TOKEN }}
          path: .sdk/module-kits
          persist-credentials: false
      - name: The latest kits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gripforgeai/module-kits
          ref: ${{ steps.sdk.outputs.latest }}
          token: ${{ secrets.GF_SPLIT_READ_TOKEN }}
          path: kits-latest
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            wasm
            kits-latest
          shared-key: compat
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
      - name: The core of the compiler (pinned SDK)
        run: node scripts/prepare.mjs
      - name: The room of the latest kits, checked and built (native and wasm)
        run: |
          set -eu
          echo "latest kits: $(git -C kits-latest rev-parse HEAD) ($(git -C kits-latest log -1 --format=%cs))"
          node bin/gripforge-build.mjs kits-latest/kits/dev_builder/tests/testbed/room \
            --kits kits-latest/kits --sdk kits-latest --target all --out "$RUNNER_TEMP/compat" --target-dir "$RUNNER_TEMP/compat-target"
      - name: The compiled room reaches the same state as the dev mode (kits' test compiled)
        working-directory: kits-latest
        run: |
          set -eu
          [ -f kits/dev_builder/tests/compiled.rs ] || { echo "::error::the latest kits have no kits/dev_builder/tests/compiled.rs: nothing compares the compiled game with the dev mode"; exit 1; }
          export GRIPFORGE_COMPILER="$GITHUB_WORKSPACE/bin/gripforge-build.mjs"
          nice -n 15 cargo test -j 4 -p gfkit-dev-builder-tests --test compiled -- --nocapture
