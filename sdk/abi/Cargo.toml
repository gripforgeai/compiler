[package]
name = "gripforge-abi"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "The contract alone between the GripForge kit host, the kit modules and the gateways: C tables, fixed layouts, function numbers, interfaces, the calls between modules, the port types and the frame format. No logic of a host or of a kit."
publish = false
# Written new for the refonte (docs/sources.md): the four crates gripforge-kitcall, gripforge-modcall, gripforge-ports
# and gripforge-wire of the sources, gathered as modules of one crate.

[dependencies]
# The shared contracts this crate lays or reads by offset (docs/decisions/2026-11-20-abi-par-contrat.md, lot 3): the head
# of the INPUT buffer, the directory of the published regions and the neutral blocks of the inputs.
# The shared contracts of the physics link (lot 2: the published blocks and the words of the orders, from
# core/abi/contracts/abi.physics.*.json; the link, its set, the revision keys, the step and the parameters of the
# intentions: abi.intent.*.json, lot 2c) and the records this crate is held to (lot 5, src/layout.rs) — docs/decisions/2026-11-20-abi-par-contrat.md.
# The wire frame (wire/frame.rs), the block of rays (re-exported for the player), the words of the physics entries,
# the contacts and w_near (near.rs): #1865, oublis 3 and 7.
gripforge-contracts = { workspace = true, features = ["abi.intent.view", "abi.physics.answers", "abi.physics.events", "abi.physics.hits", "abi.physics.names", "abi.physics.poses", "abi.sensor.contacts", "abi.physics.bodies", "abi.physics.moving", "abi.physics.slots", "abi.physics.body_desc", "abi.physics.body_state", "abi.physics.shape_words", "abi.physics.hit_words", "abi.physics.joint", "abi.physics.vehicle", "abi.physics.vehicle_wheel", "abi.physics.vehicle_input", "abi.physics.vehicle_state", "abi.physics.vehicle_wheel_state", "abi.physics.buoyancy", "abi.physics.buoyancy_cell", "abi.physics.fluid", "abi.physics.wave", "abi.physics.shape_table", "abi.physics.shapes", "abi.mem.fixed_value", "abi.mem.fixed_pair", "abi.mem.fixed_block", "abi.mem.bytes", "abi.kit.ctx", "abi.zone.buffer", "abi.zone.directory", "abi.zone.state", "abi.zone.events", "abi.zone.event", "abi.zone.regions", "abi.engine.entity", "abi.engine.pose", "abi.engine.world", "abi.fast.hook", "abi.fast.scalar", "abi.fast.service", "abi.calls.header", "abi.calls.reply", "abi.native.host", "abi.native.kit", "abi.native.links", "abi.native.bytes", "abi.native.zone_place", "abi.native.svc_provider", "abi.host.api", "abi.zone.input", "abi.zone.published", "abi.input.ring", "abi.input.pointer", "abi.input.actions", "abi.input.bindings", "abi.mail.head", "abi.mail.message", "abi.mail.entry", "abi.mail.table", "abi.intent.step", "abi.intent.velocity", "abi.intent.target", "abi.intent.follow", "abi.intent.force", "abi.intent.jump", "abi.intent.burst", "abi.intent.set_velocity", "abi.intent.turn", "abi.physics.link", "abi.physics.set", "abi.physics.revisions", "abi.wire.frame", "abi.wire.section", "abi.wire.transform", "abi.wire.velocity", "abi.rays.ask", "abi.rays.ray", "abi.physics.character_desc", "abi.physics.box_desc", "abi.physics.ray", "abi.physics.ray_hit", "abi.physics.overlap_sphere", "abi.physics.overlap_box", "abi.physics.contact", "abi.physics.link_event", "abi.near.question", "abi.near.cond", "abi.near.hit"] }
# preserve_order: objects keep the order of the document; float_roundtrip: numbers read as `JSON.parse` does;
# raw_value: the ports read slot metadata without allocating the whole document.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }

[features]
default = ["json"]
# The frame format reads and writes serde_json values (once gripforge-wire `json`).
json = []
# The module side of the calls between modules: `call`, `expose`, the `gf_calls` imports (once gripforge-modcall
# `guest`; wasm32 links only).
guest = []
# A kit module of the common memory (wasm): what it reads comes from modules of the same memory, so its readers accept
# fixed-layout blocks (`T_FIXED`) unless told otherwise (once gripforge-kitcall `trusted-peer`).
trusted-peer = []
