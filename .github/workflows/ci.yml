name: CI
# Each pull request and each push to main: cargo fmt --check, clippy -D warnings, cargo test, the line coverage
# (cargo llvm-cov; 90 % wanted: for now under it is a warning, set COVERAGE_ENFORCE to 'true' to make it fail), and the
# build of the Linux binary, run with --version and --check on the example room of the repository (examples/room).
# The compiler only GENERATES .rs files; the job `game` then builds the generated crate of the example room (native and
# wasm) on the public SDK of this repository (sdk/), with no access to the private kits repository. No secret, no S3,
# no npm, no paid AI call.
# GitHub-hosted runners; never pull_request_target (a fork's pull request runs with a read-only token and no secret);
# contents: read; actions pinned by SHA.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  EXAMPLE_ROOM: examples/room
  COVERAGE_MIN: '90'
  COVERAGE_ENFORCE: 'false'

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.0
          components: rustfmt,clippy,llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: compiler
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-llvm-cov
      - name: Coverage (lines)
        run: |
          set -u
          cargo llvm-cov --workspace --locked --summary-only
          if ! cargo llvm-cov report --fail-under-lines "$COVERAGE_MIN" >/dev/null 2>&1; then
            if [ "$COVERAGE_ENFORCE" = true ]; then
              echo "::error::line coverage under $COVERAGE_MIN %"; exit 1
            fi
            echo "::warning::line coverage under $COVERAGE_MIN % (warning only for now)"
          fi

  binary:
    # The binary of a pull request: built (release profile), then run on the example room.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: compiler-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release --locked --bin gripforge-build
      - name: Run it (--version, --check on the example room)
        run: |
          set -eu
          bin=target/release/gripforge-build
          "$bin" --version
          "$bin" --check "$EXAMPLE_ROOM"

  game:
    # End to end, as a user outside GripForge: the example room generated, then its game crate built native and wasm on
    # the public SDK of this repository alone (sdk/), by path (--sdk) and by git (this repository at the tested commit,
    # as the default tag line does). Any fetch of the private kits repository is made to fail.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: compiler-game
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: No access to the kits repository
        run: |
          set -eu
          git config --global url."https://invalid.invalid/no-module-kits/".insteadOf "https://github.com/gripforgeai/module-kits"
      - name: Build gripforge-build
        run: cargo build --locked --bin gripforge-build
      - name: The room on sdk/ by path, native and wasm
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          set -eu
          out="$RUNNER_TEMP/room-path"
          target/debug/gripforge-build "$EXAMPLE_ROOM" --out "$out" --sdk "$GITHUB_WORKSPACE/sdk"
          grep -q "$GITHUB_WORKSPACE/sdk/kit-guest" "$out/game/Cargo.toml"
          if grep -n module-kits "$out/game/Cargo.toml"; then exit 1; fi
          cd "$out/game"
          cargo build --target-dir "$RUNNER_TEMP/target"
          cargo build --release --target wasm32-unknown-unknown --target-dir "$RUNNER_TEMP/target"
          if grep -n module-kits Cargo.lock; then exit 1; fi
          ls -l "$RUNNER_TEMP/target/debug/libgfkit_game_main.so" "$RUNNER_TEMP/target/wasm32-unknown-unknown/release/gfkit_game_main.wasm"
      - name: The room with the game's code (sources of project.gripforge), native and wasm
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          set -eu
          room="$RUNNER_TEMP/room-code"
          cp -r "$EXAMPLE_ROOM" "$room"
          cp tests/game-code/rules.rs "$room/rules.rs"
          jq '. + { sources: ["rules.rs"] }' "$EXAMPLE_ROOM/project.gripforge" > "$room/project.gripforge"
          before="$(sha256sum "$room/rules.rs")"
          target/debug/gripforge-build "$room" --sdk "$GITHUB_WORKSPACE/sdk"
          grep -q 'pub mod rules;' "$room/.build/game/src/lib.rs"
          cd "$room/.build/game"
          cargo build --target-dir "$RUNNER_TEMP/target"
          cargo build --release --target wasm32-unknown-unknown --target-dir "$RUNNER_TEMP/target"
          [ "$(sha256sum "$room/rules.rs")" = "$before" ]
      - name: The room on sdk/ by git (this repository at the tested commit), native and wasm
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          set -eu
          out="$RUNNER_TEMP/room-git"
          rev="$(git rev-parse HEAD)"
          GRIPFORGE_SDK_GIT="file://$GITHUB_WORKSPACE" target/debug/gripforge-build "$EXAMPLE_ROOM" --out "$out" --sdk-rev "$rev"
          grep -q "rev = \"$rev\"" "$out/game/Cargo.toml"
          if grep -n module-kits "$out/game/Cargo.toml"; then exit 1; fi
          cd "$out/game"
          cargo build --target-dir "$RUNNER_TEMP/target"
          cargo build --release --target wasm32-unknown-unknown --target-dir "$RUNNER_TEMP/target"
          if grep -n module-kits Cargo.lock; then exit 1; fi
          grep -q "file://$GITHUB_WORKSPACE?rev=$rev" Cargo.lock
