# The game dev_builder_room on Bevy: the kits (gfkits-bevy-native), then the creator's plugin (index.rs).
[package]
name = "gripforge-app-dev-builder-room"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "gripforge_app_dev_builder_room"
path = "src/lib.rs"

[[bin]]
name = "dev-builder-room"
path = "src/main.rs"

[dependencies]
# A 3D game with its UI, in a window: Bevy's 3d and ui profiles without audio (the kits' audio goes through the
# engine's native player) and without Wayland, which needs its system library to build (feature `wayland` below).
bevy = { version = "0.20", default-features = false, features = ["default_app", "std", "bevy_gilrs", "bevy_winit", "bevy_clipboard", "default_font", "multi_threaded", "x11", "custom_cursor", "sysinfo_plugin", "3d_bevy_render", "scene", "picking", "ui_api", "ui_bevy_render", "bevy_ui_widgets"] }
# The kits in a Bevy game (KitsPlugin, KitsSet, KitsWorldExt), the simple shapes and the mouse of the window.
gfkits-bevy-native = { git = "https://github.com/gripforgeai/module-kits", rev = "e6d744cb9160f723f0936f0e4880a3b55265ac86", features = ["shapes", "pointer"] }
serde_json = "1"

[features]
# A window on Wayland too (needs libwayland-client to build).
wayland = ["bevy/wayland"]

# Its own workspace: never a member of the game's folder.
[workspace]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
strip = true
